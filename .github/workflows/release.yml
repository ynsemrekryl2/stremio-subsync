# A `v*` tag builds the server for 64-bit Intel and ARM Linux and publishes
# both as a GitHub release (SS-065) and as a container image. The install
# script downloads releases/latest/download/stremio-subsync-$(uname -m)-linux.
# Built on Ubuntu 22.04, so any Linux with glibc 2.35 or later runs it.
name: release

on:
  push:
    tags: ["v*"]
  # Builds an existing tag again, e.g. one pushed before this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.2.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --component clippy,rustfmt
      - run: cargo build --release --locked
      - name: Check the version matches the tag
        run: |
          got="$(target/release/stremio-subsync --version)"
          want="stremio-subsync ${TAG#v}"
          [ "$got" = "$want" ] || { echo "binary says '$got', tag wants '$want'" >&2; exit 1; }
      - name: Name the binary for its architecture
        run: |
          mkdir dist
          name="stremio-subsync-${{ matrix.arch }}-linux"
          cp target/release/stremio-subsync "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  # The same two binaries as one x86_64 + ARM64 image on GitHub's registry,
  # for compose.yaml: ghcr.io/<repo>:<version>, :<major.minor> and, for the
  # newest tag, :latest.
  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # All tags, to tell whether this one is the newest.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          tags=(-t "$image:$version" -t "$image:${version%.*}")
          newest="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          [ "$newest" = "$TAG" ] && tags+=(-t "$image:latest")
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg BINARY=release \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            "${tags[@]}" --push .
