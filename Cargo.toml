[package]
name = "stremio-subsync"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
encoding_rs = "0.8"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "0.1"
# Raw HTTP in the OpenRouter tests.
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
